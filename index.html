<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sweety Business</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f6f7fa;--ink:#0a0a0a;--muted:#5b5f6b;--blue:#1f3fd1;--blue2:#1732a8;--green:#12a150;--red:#d7263d;--line:#e6e8ee;
--l1:0 2px 6px rgba(15,23,60,.05),0 8px 20px rgba(15,23,60,.06);--l2:0 4px 10px rgba(15,23,60,.06),0 18px 40px rgba(15,23,60,.10);--l3:0 8px 18px rgba(15,23,60,.08),0 30px 60px rgba(15,23,60,.14);
--font:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif}
[hidden]{display:none!important}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--soft);color:var(--ink);font:500 16px/1.5 var(--font);overflow-x:hidden;padding-bottom:90px}
a{color:inherit;text-decoration:none}img{display:block}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);box-shadow:var(--l1);padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
header img{width:36px;height:36px;border-radius:50%;object-fit:cover}
header b{font-size:18px;font-weight:800;letter-spacing:-.01em}
main{max-width:1100px;margin:0 auto;padding:16px 12px}
.sec{background:var(--bg);border-radius:26px;box-shadow:var(--l2);padding:18px 14px;margin:0 0 22px}
.sec>h2{margin:0 4px 14px;font-size:20px;font-weight:800}
.frame{position:relative;overflow:hidden;background:var(--soft);border-radius:18px}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.r-sq{aspect-ratio:1/1}.r-wide{aspect-ratio:16/9}.r-ban{aspect-ratio:21/9}
.card{background:var(--bg);border-radius:20px;box-shadow:var(--l1);overflow:hidden;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.22,.8,.3,1),box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:var(--l3)}
.card .frame{border-radius:0}
.body{padding:12px;display:grid;gap:4px}
.price{font-weight:800;color:var(--ink)}
.ok{color:var(--green);font-weight:700;font-size:14px}.low{color:var(--red);font-weight:700;font-size:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 22px;border:0;border-radius:999px;background:var(--blue);color:#fff;font:700 15px var(--font);box-shadow:0 6px 16px rgba(31,63,209,.28);cursor:pointer;transition:transform .2s,background .2s}
.btn:hover{transform:translateY(-2px);background:var(--blue2)}
.btn.wa{background:var(--green);box-shadow:0 6px 16px rgba(18,161,80,.28)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;margin:0 12px 12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
.row{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding:4px 4px 14px;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.row>*{flex:0 0 78%;scroll-snap-align:start}
.hero{position:relative;border-radius:22px;overflow:hidden;box-shadow:var(--l2)}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:44px 18px 18px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.62))}
.hero h2{margin:0 0 6px;font-size:24px;font-weight:800}.hero p{margin:0 0 12px}
.cat{text-align:center;font-weight:700}.cat .frame{border-radius:50%;margin:0 auto 8px;max-width:130px;box-shadow:var(--l1)}
.ad{position:relative}.ad small{position:absolute;top:10px;left:10px;z-index:2;background:rgba(255,255,255,.92);border-radius:999px;padding:3px 10px;font-weight:700;font-size:12px}
.txt{display:grid;gap:14px}.txt p{margin:0;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:30px 10px}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;box-shadow:var(--l3)}
@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.drift{animation:drift 6s ease-in-out infinite}
@media(prefers-reduced-motion:reduce){.drift{animation:none}.card,.btn{transition:none}}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr)}.row>*{flex-basis:260px}.sec{padding:24px 20px}.hero h2{font-size:34px}.hero .frame{aspect-ratio:21/8}.txt{grid-template-columns:1fr 1fr;align-items:center}}
</style>
</head>
<body>
<header><img id="logo" alt="" hidden><b id="shop">Sweety Business</b></header>
<main id="app"><p class="empty">Chargement…</p></main>
<a id="wa" class="btn wa fab drift" href="#" hidden>Contacter sur WhatsApp</a>

<script>
/* ===== CONFIGURATION : coller l'URL et la clé « anon » (publique) de Supabase ===== */
const SUPABASE_URL = "https://prwxezelazbaiifpntne.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_Ok6whdEBFqR85ym00CphcQ_QH5EsWqg";
/* Sections d'accueil : table home_sections, colonne config (JSON) :
   {"title","subtitle","image_url","button_label","link_url","text","images":[{"url","link","alt"}]} */

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const url = (u) => (/^https?:\/\//i.test(u || "") ? esc(u) : "");
const fcfa = (n) => Number(n).toLocaleString("fr-FR") + " FCFA";
let S = { whatsapp_number: "", low_stock_threshold: 5 };

async function get(path) {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_ANON_KEY} });
  if (!r.ok) { let d = ""; try { d = (await r.json()).message || ""; } catch {} throw new Error(`${path.split("?")[0]} : ${r.status} ${d}`); }
  return r.json();
}
const wa = (text) => `https://wa.me/${(S.whatsapp_number || "").replace(/\D/g, "")}?text=${encodeURIComponent(text)}`;
const img = (src, ratio, alt = "", eager = false) =>
  `<div class="frame ${ratio}">${url(src) ? `<img src="${url(src)}" alt="${esc(alt)}" ${eager ? "" : 'loading="lazy"'} decoding="async">` : ""}</div>`;

function productCard(p) {
  const cover = [...(p.product_images || [])].sort((a, b) => a.position - b.position)[0]?.url;
  const low = p.stock <= (p.low_stock_threshold ?? S.low_stock_threshold);
  const msg = `Bonjour, je suis intéressé(e) par : ${p.name} (${fcfa(p.price)}).`;
  return `<article class="card">${img(cover, "r-sq", p.name)}
    <div class="body"><strong>${esc(p.name)}</strong><span class="price">${fcfa(p.price)}</span>
    <span class="${low ? "low" : "ok"}">${low ? "Bientôt épuisé" : "En stock"}</span></div>
    <a class="btn wa sm" href="${wa(msg)}" target="_blank" rel="noopener">Commander sur WhatsApp</a></article>`;
}
const products = (q) => get(`products?select=id,name,price,stock,low_stock_threshold,product_images(url,position)&is_active=eq.true&${q}`);
const wrap = (title, inner) => `<section class="sec">${title ? `<h2>${esc(title)}</h2>` : ""}${inner}</section>`;
const link = (c, cls = "btn") => (c.button_label && url(c.link_url) ? `<a class="${cls}" href="${url(c.link_url)}">${esc(c.button_label)}</a>` : "");

const R = {
  async hero_banner(s) {
    const c = s.config || {};
    return `<section class="hero" style="margin-bottom:22px">${img(c.image_url, "r-ban", c.title || "", true)}
      <div class="cap">${c.title ? `<h2>${esc(c.title)}</h2>` : ""}${c.subtitle ? `<p>${esc(c.subtitle)}</p>` : ""}${link(c)}</div></section>`;
  },
  async image_slider(s) { return slider(s, "r-wide"); },
  async carousel(s) { return slider(s, "r-wide"); },
  async categories(s) {
    const cats = await get("categories?select=id,name,image_url&is_active=eq.true&order=position,name");
    return cats.length ? wrap(s.title || "Catégories", `<div class="row">${cats.map((c) => `<div class="cat" style="flex-basis:120px">${img(c.image_url, "r-sq", c.name)}${esc(c.name)}</div>`).join("")}</div>`) : "";
  },
  async popular(s) { return grid(s.title || "Produits populaires", await products("is_popular=eq.true&order=created_at.desc&limit=8")); },
  async new_arrivals(s) { return grid(s.title || "Nouveautés", await products("order=created_at.desc&limit=8")); },
  async recommendations(s) {
    const list = (await products("order=created_at.desc&limit=24")).sort(() => Math.random() - 0.5).slice(0, 8);
    return grid(s.title || "Recommandations", list);
  },
  async promotions(s) {
    const promos = await get("promotions?select=*&is_active=eq.true");
    if (!promos.length) return "";
    return wrap(s.title || "Promotions", `<div class="row">${promos.map((p) => `<div class="card body"><strong>${esc(p.name || p.title)}</strong></div>`).join("")}</div>`);
  },
  async partner_ads(s) {
    const ads = await get("ads?select=id,business_name,title,description,image_url,cta_label,link_url&is_active=eq.true");
    if (!ads.length) return "";
    return wrap(s.title || "Nos partenaires", `<div class="row">${ads.map((a) => `<article class="card ad"><small>Publicité · ${esc(a.business_name)}</small>${img(a.image_url, "r-wide", a.title)}
      <div class="body"><strong>${esc(a.title)}</strong><span style="color:var(--muted)">${esc(a.description)}</span></div>
      ${a.cta_label && url(a.link_url) ? `<a class="btn sm" href="${url(a.link_url)}" target="_blank" rel="noopener sponsored">${esc(a.cta_label)}</a>` : ""}</article>`).join("")}</div>`);
  },
  async text_image(s) {
    const c = s.config || {};
    return wrap("", `<div class="txt">${img(c.image_url, "r-wide", c.title || "")}<div>${c.title ? `<h2 style="margin:0 0 8px">${esc(c.title)}</h2>` : ""}<p>${esc(c.text)}</p><div style="margin-top:12px">${link(c)}</div></div></div>`);
  },
  async custom_banner(s) { return R.hero_banner(s); },
};
function slider(s, ratio) {
  const imgs = (s.config?.images || []).filter((i) => url(i.url));
  if (!imgs.length) return "";
  return wrap(s.title, `<div class="row">${imgs.map((i) => { const a = url(i.link); const el = img(i.url, ratio, i.alt || ""); return a ? `<a href="${a}">${el}</a>` : `<div>${el}</div>`; }).join("")}</div>`);
}
function grid(title, list) { return list.length ? wrap(title, `<div class="grid">${list.map(productCard).join("")}</div>`) : ""; }

(async function () {
  const app = $("#app");
  try {
    const [settings] = await get("settings?select=*&id=eq.1");
    if (settings) {
      S = settings;
      $("#shop").textContent = settings.shop_name;
      document.title = settings.shop_name;
      if (url(settings.logo_url)) { $("#logo").src = settings.logo_url; $("#logo").hidden = false; }
      if (settings.whatsapp_number) { const a = $("#wa"); a.href = wa(`Bonjour ${settings.shop_name}, j'ai une question.`); a.target = "_blank"; a.rel = "noopener"; a.hidden = false; }
    }
    const sections = await get("home_sections?select=*&is_visible=eq.true&order=position");
    const html = (await Promise.all(sections.map((s) => (R[s.type] ? R[s.type](s).catch(() => "") : "")))).join("");
    app.innerHTML = html || '<p class="empty">Aucune section n\'est encore configurée. Ajoutez-en depuis l\'administration.</p>';
  } catch (e) {
    app.innerHTML = '<p class="empty">Impossible de charger la boutique. Vérifiez SUPABASE_URL et SUPABASE_ANON_KEY dans index.html.</p><p class="empty"><small>Détail : ' + esc(e.message) + '</small></p>';
    console.error(e);
  }
})();
</script>
</body>
</html>
